<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filipe.com | Checkout Integrado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .checkout-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 100%;
            border: 1px solid #eaeaea;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #000;
        }

        .item-box {
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #0070f3;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #0070f3;
        }

        .btn-pay {
            width: 100%;
            background: #0070f3;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-pay:hover {
            background: #0051b3;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <h2>Finalizar Pagamento</h2>
    
    <div class="item-box">
        <span>Serviço Digital / Produto</span>
        <span class="price">25.00 €</span>
    </div>

    <!-- Formulário processado por JS -->
    <div class="input-group">
        <label for="orderId">Número da Encomenda (ou Nome)</label>
        <input type="text" id="orderId" placeholder="Ex: ENC12345" required>
    </div>

    <div class="input-group">
        <label for="method">Método de Pagamento</label>
        <select id="method">
            <option value="2">📱 MB WAY</option>
            <option value="1">📐 Multibanco</option>
            <option value="4">💳 Cartão de Crédito</option>
        </select>
    </div>

    <button class="btn-pay" onclick="processarPagamento()">Pagar Agora</button>
</div>

<script>
    function processarPagamento() {
        const orderId = document.getElementById('orderId').value.trim();
        const method = document.getElementById('method').value;
        const amount = "25.00"; // Valor fixo do seu produto

        if (!orderId) {
            alert('Por favor, insira uma identificação para a encomenda.');
            return;
        }

        // SUBSTITUA ESTES DADOS PELOS SEUS QUANDO CRIAR CONTA NA IFTHENPAY
        const GATEWAY_KEY = "TEST-999999"; // A sua Chave de Gateway Pública/Testes
        
        // Construção do URL seguro do Simple Checkout da ifthenpay
        // Documentação oficial: https://www.ifthenpay.com/docs/en/guides/simple-checkout/
        const gatewayUrl = `https://ifthenpay.com{GATEWAY_KEY}&id=${encodeURIComponent(orderId)}&amount=${amount}&selected_method=${method}&lang=PT`;

        // Redireciona o cliente para o ecrã seguro onde ele paga ou vê a referência
        window.location.href = gatewayUrl;
    }
</script>

</body>
</html>
